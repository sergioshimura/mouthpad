<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#7b2a9e"/><stop offset="1" stop-color="#24308f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset="1" stop-color="#c9902e"/></linearGradient>
    <linearGradient id="resin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset="1" stop-color="#dfe6f2" stop-opacity=".45"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <text x="400" y="50" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">MouthPad DIY — vista superior (palato)</text>
  <!-- placa de acetato em forma de arcada -->
  <path d="M150 400 C120 250 220 110 400 105 C580 110 680 250 650 400 L585 410 C600 290 520 190 400 188 C280 190 200 290 215 410 Z" fill="url(#resin)" stroke="#fff" stroke-width="3"/>
  <!-- dentes (encaixe) -->
  <g fill="#fff" fill-opacity=".55" stroke="#c7d0e0">
    <rect x="170" y="330" width="34" height="40" rx="12"/><rect x="178" y="270" width="34" height="40" rx="12"/>
    <rect x="200" y="215" width="34" height="38" rx="12"/><rect x="238" y="168" width="34" height="36" rx="12"/>
    <rect x="290" y="135" width="38" height="36" rx="12"/><rect x="350" y="120" width="44" height="36" rx="12"/>
    <rect x="406" y="120" width="44" height="36" rx="12"/><rect x="472" y="135" width="38" height="36" rx="12"/>
    <rect x="528" y="168" width="34" height="36" rx="12"/><rect x="566" y="215" width="34" height="38" rx="12"/>
    <rect x="588" y="270" width="34" height="40" rx="12"/><rect x="596" y="330" width="34" height="40" rx="12"/>
  </g>
  <!-- trilhas flex -->
  <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <path d="M360 300 C320 310 290 330 245 360"/><path d="M360 315 C320 330 290 350 250 385"/>
    <path d="M440 300 C480 310 510 330 555 360"/><path d="M440 315 C480 330 510 350 550 385"/>
  </g>
  <!-- sensor capacitivo 6x6 -->
  <rect x="350" y="230" width="100" height="100" rx="14" fill="url(#gold)" stroke="#8a5d14" stroke-width="2"/>
  <g stroke="#8a5d14" stroke-width="1.5" opacity=".7">
    <line x1="350" y1="246" x2="450" y2="246"/><line x1="350" y1="263" x2="450" y2="263"/><line x1="350" y1="280" x2="450" y2="280"/>
    <line x1="350" y1="297" x2="450" y2="297"/><line x1="350" y1="314" x2="450" y2="314"/>
    <line x1="366" y1="230" x2="366" y2="330"/><line x1="383" y1="230" x2="383" y2="330"/><line x1="400" y1="230" x2="400" y2="330"/>
    <line x1="417" y1="230" x2="417" y2="330"/><line x1="434" y1="230" x2="434" y2="330"/>
  </g>
  <!-- módulos laterais -->
  <rect x="200" y="350" width="70" height="55" rx="10" fill="#2d2d2d" stroke="#f6d27a" stroke-width="2"/>
  <text x="235" y="383" fill="#f6d27a" font-size="13" text-anchor="middle">LiPo</text>
  <rect x="530" y="350" width="70" height="55" rx="10" fill="#1b4d2e" stroke="#f6d27a" stroke-width="2"/>
  <text x="565" y="375" fill="#f6d27a" font-size="12" text-anchor="middle">nRF52840</text><text x="565" y="392" fill="#f6d27a" font-size="12" text-anchor="middle">+ MPR121</text>
  <!-- legendas -->
  <g fill="#fff" font-size="15">
    <text x="470" y="250">← touchpad 6×6 (língua)</text>
    <text x="40" y="470">Resina/acetato transparente encapsulando tudo · BLE HID mouse</text>
    <text x="40" y="495" font-size="13" opacity=".8">Ilustração conceitual do protótipo deste repositório — não é o produto comercial.</text>
  </g>
</svg>
